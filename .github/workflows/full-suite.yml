name: Full Python test suite
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: full-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Check imports compile without running the bots
        run: python -m compileall -q .
      - name: Run entire synthetic/offline regression suite
        env:
          PYTHONUNBUFFERED: '1'
        run: python -m pytest -q
