name: Research adapter checks
on:
  pull_request:
  push:
    branches: [main, scaramouche]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install aiohttp aiosqlite discord.py defusedxml youtube-transcript-api
      - run: python -m compileall -q research_sources.py research_commands.py natural_research.py conversation_references.py memory_retrieval.py natural_actions.py bot.py
      - run: python -m unittest discover -s tests -p 'test_research_sources.py' -v
      - run: python -m unittest discover -s tests -p 'test_conversation_references.py' -v

      - run: python -m unittest discover -s tests -p 'test_memory_retrieval.py' -v
      - run: python -m unittest discover -s tests -p 'test_natural_actions.py' -v
